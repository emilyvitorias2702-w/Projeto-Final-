<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Produtos</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
    .cadastro-container {
        max-width: 700px;
        margin: 40px auto;
        background: rgba(255,255,255,0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .cadastro-container h2 {
        color: #0d1b2a;
        font-weight: bold;
        margin-bottom: 30px;
        text-align: center;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        color: #0d1b2a;
        font-weight: bold;
        margin-bottom: 8px;
        display: block;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.3s;
        color: #000;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
        border-color: #ffd700;
        outline: none;
    }

    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }

    .imagens-label {
        display: inline-block;
        padding: 12px 20px;
        background: #0d6efd;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .imagens-label:hover {
        background: #0b5ed7;
    }

    #imagemCadastro {
        display: none;
    }

    .preview-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 15px;
    }

    .preview-grid > div {
        position: relative;
    }

    .preview-grid img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
        border: 3px solid #ddd;
    }

    .preview-grid button {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #ff4444;
        color: white;
        border: none;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: 0.2s;
    }

    .preview-grid button:hover {
        background: #cc0000;
    }

    .botoes-cadastro {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .botoes-cadastro button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-cadastrar {
        background: #198754;
        color: white;
    }

    .btn-cadastrar:hover {
        background: #157347;
    }

    .btn-limpar {
        background: #dc3545;
        color: white;
    }

    .btn-limpar:hover {
        background: #bb2d3b;
    }

    #mensagemCadastro {
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        font-weight: bold;
    }

    @media(max-width: 768px) {
        .cadastro-container {
            margin: 20px;
            padding: 25px;
        }

        .preview-grid img {
            width: 100px;
            height: 100px;
        }
    }
</style>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-trophy-fill"></i> Copa Store 2026
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastro</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu1.html">História</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu2.html">Contato</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu3.html">Dicas</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div class="cadastro-container">
    <h2>📦 Cadastrar Novo Produto</h2>

    <div class="form-group">
        <label>Nome do Produto</label>
        <input type="text" id="nomeCadastro" placeholder="Ex: Camisa Brasil Home">
    </div>

    <div class="form-group">
        <label>Descrição</label>
        <textarea id="descricaoCadastro" placeholder="Descreva o produto..."></textarea>
    </div>

    <div class="form-group">
        <label>Preço (R$)</label>
        <input type="number" id="precoCadastro" placeholder="Ex: 159.90" step="0.01" min="0">
    </div>

    <div class="form-group">
        <label>Categoria</label>
        <select id="categoriaCadastro">
            <option value="Camisas">Camisas</option>
            <option value="Acessórios">Acessórios</option>
            <option value="Chuteiras">Chuteiras</option>
            <option value="Bonés">Bonés</option>
            <option value="Outros">Outros</option>
        </select>
    </div>

    <div class="form-group">
        <label>Tamanho</label>
        <input type="text" id="tamanhoCadastro" placeholder="Ex: P, M, G, GG">
    </div>

    <div class="form-group">
        <label>Cor</label>
        <input type="text" id="corCadastro" placeholder="Ex: Verde e Amarelo">
    </div>

    <div class="form-group">
        <label>Quantidade em Estoque</label>
        <input type="number" id="quantidadeCadastro" placeholder="Ex: 20" min="1">
    </div>

    <div class="form-group">
        <label>Imagens do Produto (máximo 5)</label>
        <label class="imagens-label">
            Escolher Imagens
            <input type="file" id="imagemCadastro" accept="image/*" onchange="previewImagens(event)" multiple>
        </label>
        <div id="previewCadastro" class="preview-grid"></div>
    </div>

    <div class="botoes-cadastro">
        <button class="btn-cadastrar" onclick="cadastrarProduto()">✅ Cadastrar Produto</button>
        <button class="btn-limpar" onclick="limparCadastro()">🗑️ Limpar</button>
    </div>

    <p id="mensagemCadastro"></p>
</div>

<footer>
    <p>© 2026 Copa Store - Todos os direitos reservados</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
